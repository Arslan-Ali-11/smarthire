{% extends "base.html" %}

{% block title %}403 Forbidden — SmartHire{% endblock %}

{% block content %}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding-top: 80px;">
    <div class="text-center">
        <div style="font-size: 6rem; font-weight: 900; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1;">
            403
        </div>
        <h4 class="fw-bold mt-3 mb-2">Access Denied</h4>
        <p class="text-muted mb-4" style="max-width: 400px; margin: 0 auto;">
            You don't have permission to access this page. Please log in with the correct account.
        </p>
        <a href="{{ url_for('auth.home') }}" class="btn-primary-custom" style="padding: 0.7rem 2rem;">
            <i class="bi bi-house me-1"></i> Go Home
        </a>
    </div>
</div>
{% endblock %}

{% block footer %}{% endblock %}
